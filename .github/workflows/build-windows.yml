
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download workflow files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Find and download project ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $workflow = Get-Content ".github/workflows/build.yml" -Raw

          $match = [regex]::Match(
            $workflow,
            '(?m)^\s*ZIP_FILE\s*=\s*["'']?(.+?\.zip)["'']?\s*$'
          )

          if (-not $match.Success) {
            throw "Could not find ZIP_FILE in build.yml"
          }

          $zipPath = $match.Groups[1].Value.Trim()
          Write-Host "Project ZIP: $zipPath"

          $encodedPath = (
            $zipPath -split '/' |
            ForEach-Object { [uri]::EscapeDataString($_) }
          ) -join '/'

          $apiUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$encodedPath?ref=$env:GITHUB_SHA"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $response = Invoke-RestMethod -Uri $apiUrl -Headers $headers

          $bytes = [Convert]::FromBase64String(
            ($response.content -replace '\s', '')
          )

          [System.IO.File]::WriteAllBytes(
            "$env:GITHUB_WORKSPACE\project.zip",
            $bytes
          )

          Write-Host "ZIP downloaded successfully."

      - name: Extract project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app | Out-Null

          Expand-Archive `
            -LiteralPath project.zip `
            -DestinationPath app `
            -Force

          if (!(Test-Path "app/package.json")) {
            throw "package.json was not found."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: app
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund electron electron-builder

      - name: Configure Electron
        working-directory: app
        shell: pwsh
        run: |
          @'
          const { app, BrowserWindow, protocol, net, shell } = require('electron');
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');

          protocol.registerSchemesAsPrivileged([{
            scheme: 'app',
            privileges: {
              standard: true,
              secure: true,
              supportFetchAPI: true,
              corsEnabled: true
            }
          }]);

          app.setPath(
            'userData',
            path.join(app.getPath('appData'), 'HumanForceManagement')
          );

          async function createWindow() {
            const win = new BrowserWindow({
              width: 1400,
              height: 900,
              minWidth: 900,
              minHeight: 650,
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith('https://') || url.startsWith('http://')) {
                shell.openExternal(url);
              }
              return { action: 'deny' };
            });

            await win.loadURL('app://localhost/index.html');
          }

          app.whenReady().then(() => {
            const distDir = path.resolve(__dirname, 'dist');

            protocol.handle('app', async (request) => {
              const pathname = decodeURIComponent(
                new URL(request.url).pathname
              );

              const relativePath = pathname.replace(/^\/+/, '') || 'index.html';
              const filePath = path.resolve(distDir, relativePath);

              if (
                filePath !== distDir &&
                !filePath.startsWith(distDir + path.sep)
              ) {
                return new Response('Not found', { status: 404 });
              }

              try {
                return await net.fetch(pathToFileURL(filePath).toString());
              } catch {
                return new Response('File not found', { status: 404 });
              }
            });

            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Set-Content electron-main.cjs -Encoding utf8

          @'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          p.main = 'electron-main.cjs';

          p.build = {
            appId: 'com.humanforce.management.printfix',
            productName: 'Human Force Management',
            directories: {
              output: 'release'
            },
            files: [
              'dist/**/*',
              'electron-main.cjs',
              'package.json'
            ],
            win: {
              target: [{
                target: 'nsis',
                arch: ['x64']
              }]
            },
            nsis: {
              oneClick: false,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true
            },
            artifactName: 'Human-Force-Management-Setup-${version}.${ext}'
          };

          fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          '@ | node -

      - name: Build web application
        working-directory: app
        run: npm run build

      - name: Build Windows installer
        working-directory: app
        run: npx electron-builder --win nsis --x64

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Human-Force-Management-Windows
          path: app/release/*.exe
          if-no-files-found: error
          retention-days: 30
          
